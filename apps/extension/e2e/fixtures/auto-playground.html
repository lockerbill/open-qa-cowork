<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>QA Auto Playground</title>
  </head>
  <body>
    <h1>QA Auto Playground</h1>

    <!-- Cross-page navigation target for E2E scenario 5 (§13.2). -->
    <p><a id="second-page-link" href="/auto-second.html">Go to second page</a></p>

    <section id="login">
      <!-- Rememberable placeholder creds (auto-test-mode-spec §13.2). -->
      <p>Sign in with qa@example.com / Secret123!</p>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" />

        <button type="submit">Sign in</button>
      </form>
      <div id="login-error" role="alert" hidden>Invalid credentials</div>
    </section>

    <section id="dashboard" hidden>
      <h2>Welcome back, QA!</h2>
      <button id="create-item">Create item</button>
      <!-- Named-item create form + visible list for E2E scenario 1 (§13.2). -->
      <form id="item-form">
        <label for="item-name">Item name</label>
        <input id="item-name" name="item-name" type="text" />
        <button type="submit" id="add-item">Add item</button>
      </form>
      <ul id="items"></ul>
    </section>

    <script>
      document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        if (email === 'qa@example.com' && password === 'Secret123!') {
          document.getElementById('login').hidden = true;
          document.getElementById('dashboard').hidden = false;
        } else {
          document.getElementById('login-error').hidden = false;
        }
      });
      document.getElementById('create-item').addEventListener('click', () => {
        const li = document.createElement('li');
        li.textContent = 'Item ' + (document.getElementById('items').children.length + 1);
        document.getElementById('items').appendChild(li);
      });
      document.getElementById('item-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('item-name');
        if (!input.value.trim()) return;
        const li = document.createElement('li');
        li.textContent = input.value.trim();
        document.getElementById('items').appendChild(li);
        input.value = '';
      });
    </script>
  </body>
</html>
