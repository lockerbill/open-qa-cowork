name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Vendored page-agent code must never contain a dynamic-code pathway
      # (auto-test-mode-spec §4.2.1). Runs before install: needs nothing.
      - name: Vendor eval gate
        run: |
          if grep -rEn --include='*.js' --include='*.ts' '\beval[[:space:]]*\(|new Function[[:space:]]*\(' apps/extension/src/vendor/page-agent; then
            echo "::error::eval()/new Function() found in vendored page-agent code" >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck first: a bad merge resolution shows up here before anything
      # else, and it is the check that PR #1 shipped past.
      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build
